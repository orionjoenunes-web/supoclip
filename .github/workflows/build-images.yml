name: Build & Push SupoClip Images

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - 'backend/**'
      - 'docker-compose.yml'
      - '.github/workflows/build-images.yml'

permissions:
  contents: read

env:
  REGISTRY: ghcr.io

jobs:
  build:
    name: Build ${{ matrix.service.name }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        service:
          - name: frontend
            image_name: supoclip-frontend
            context: .
            dockerfile: frontend/Dockerfile
            build_args: ''
          - name: backend
            image_name: supoclip-backend
            context: ./backend
            dockerfile: ./backend/Dockerfile
            build_args: BACKEND_CPU_ONLY=true
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ matrix.service.image_name }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-

      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.service.context }}
          file: ${{ matrix.service.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: ${{ matrix.service.build_args }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.service.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service.name }}

      - name: Publish worker aliases for the backend manifest
        if: matrix.service.name == 'backend'
        env:
          SOURCE_TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          while IFS= read -r source_tag; do
            [ -n "$source_tag" ] || continue
            worker_tag="${source_tag/-backend:/-worker:}"
            docker buildx imagetools create --tag "$worker_tag" "$source_tag"
          done <<< "$SOURCE_TAGS"
