# Use the images published by .github/workflows/build-images.yml.
# Compose v2.24.4+ supports the !reset and !override merge tags used here.
services:
  frontend:
    image: ghcr.io/orionjoenunes-web/supoclip-frontend:latest
    pull_policy: always
    build: !reset null
    volumes: !reset []

  backend:
    image: ghcr.io/orionjoenunes-web/supoclip-backend:latest
    pull_policy: always
    build: !reset null
    volumes: !override
      - uploads:/app/uploads
      - clips:/app/clips

  worker:
    image: ghcr.io/orionjoenunes-web/supoclip-worker:latest
    pull_policy: always
    build: !reset null
    volumes: !override
      - uploads:/app/uploads
      - clips:/app/clips

  # MCP is an optional separately built service and is not part of the
  # three published images. Keep it off unless you build/configure it yourself.
  mcp:
    profiles: [mcp]
